services:
  - type: web
    name: xyz-games-production
    runtime: node
    plan: standard
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: xyz-sqlite-wal-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: XYZ_DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: WINGO_MASTER_SEED
        generateValue: true
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
