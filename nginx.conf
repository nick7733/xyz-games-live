# =============================================================================
# NGINX REVERSE PROXY, SSL/TLS, DDoS PROTECTION & SSE STREAMING CONFIG
# Tuned for 20,000+ Daily Active Users (DAU) & 2,000+ Concurrent SSE Streams
# Save to: /etc/nginx/sites-available/xyzgames.conf
# =============================================================================

# 1. Connection & Request Rate Limiting Zones (Edge DDoS Protection)
limit_req_zone $binary_remote_addr zone=xyz_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=xyz_auth_limit:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=xyz_conn_limit:10m;

upstream xyz_backend {
    server 127.0.0.1:4000;
    keepalive 128;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (Managed via Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    limit_conn xyz_conn_limit 40;

    # A. Real-Time SSE Stream Endpoint (Disable buffering for instant 0ms push)
    location = /api/xyz-stream {
        proxy_pass http://xyz_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # B. Strict Brute-Force Protection on Login Endpoints
    location ~ ^/api/(auth|admin)/login {
        limit_req zone=xyz_auth_limit burst=10 nodelay;
        proxy_pass http://xyz_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C. General API Endpoints
    location /api/ {
        limit_req zone=xyz_api_limit burst=40 nodelay;
        proxy_pass http://xyz_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # D. Customer Webapp & Admin Panel Routes
    location / {
        proxy_pass http://xyz_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
